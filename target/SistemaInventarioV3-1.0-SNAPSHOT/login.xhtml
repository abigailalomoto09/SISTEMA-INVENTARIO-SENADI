<!-- 
  Ejemplo de formulario de login usando LoginBean.java
  Asumiendo que está en src/main/webapp/login.xhtml
-->
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Sistema de Inventario - Login LDAP</title>
    <link rel="stylesheet" type="text/css" href="#{request.contextPath}/css/login.css"/>
</h:head>

<h:body>
    <!-- Verificar si ya está logeado -->
    <f:metadata>
        <f:viewAction action="#{loginBean.isLogeado() ? 'dashboard' : null}"/>
    </f:metadata>

    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>Sistema de Inventario</h1>
                <p>LDAP - SC_Inventario</p>
            </div>

            <!-- Mensajes de error/éxito -->
            <p:messages id="messages" showDetail="true" closable="true"/>

            <!-- Formulario de Login -->
            <h:form id="loginForm" styleClass="#{loginBean.shake ? 'shake' : ''}">
                <div class="form-group">
                    <label for="usuario">Usuario:</label>
                    <p:inputText id="usuario"
                                 value="#{loginBean.usuario}"
                                 placeholder="Ingrese su usuario LDAP"
                                 required="true"
                                 requiredMessage="Usuario requerido"
                                 styleClass="form-control"/>
                </div>

                <div class="form-group">
                    <label for="clave">Contraseña:</label>
                    <p:password id="clave"
                                value="#{loginBean.clave}"
                                placeholder="Ingrese su contraseña"
                                required="true"
                                requiredMessage="Contraseña requerida"
                                styleClass="form-control"/>
                </div>

                <div class="form-group">
                    <p:commandButton value="Ingresar"
                                     action="#{loginBean.login()}"
                                     update="loginForm messages"
                                     styleClass="btn btn-primary btn-block"
                                     oncomplete="if(args.estaLogeado) { window.location='dashboard.xhtml'; }"/>
                </div>

                <div class="form-info">
                    <p>Auténticate contra LDAP (SC_Inventario)</p>
                    <p>Grupos soportados:</p>
                    <ul>
                        <li><strong>SC_ADMIN</strong> - Administrador (acceso total)</li>
                        <li><strong>SC_TECNICO</strong> - Técnico (modificaciones)</li>
                        <li><strong>SC_CUSTODIO</strong> - Custodio (lectura)</li>
                    </ul>
                </div>
            </h:form>
        </div>
    </div>

    <!-- CSS para efecto shake en error -->
    <style>
        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            margin: 0;
            color: #333;
        }

        .login-header p {
            color: #666;
            margin: 5px 0 0 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .form-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }

        .form-info p {
            margin: 5px 0;
        }

        .form-info ul {
            margin: 10px 0 0 20px;
            padding: 0;
        }

        .form-info li {
            margin: 3px 0;
        }
    </style>

</h:body>
</html>
